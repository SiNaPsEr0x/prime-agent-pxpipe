name: Release ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: npm test
      - run: |
          name="prime-agent-pxpipe-${GITHUB_REF_NAME#v}"
          mkdir -p dist
          rsync -a --exclude '.git' --exclude 'node_modules' ./ "dist/${name}/"
          cd dist
          zip -r "${name}.zip" "${name}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
